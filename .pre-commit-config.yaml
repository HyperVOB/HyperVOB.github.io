#
# Install: pre-commit install (pre-commit, commit-msg and pre-push hooks). CI runs the same
# hooks (.github/workflows/checks.yml). Hook revs are pinned to commit SHAs at least 7
# days old, the HyperVOB repository's revs where it has the same hook; Dependabot proposes
# updates (.github/dependabot.yml). Don't run `pre-commit autoupdate` by hand.
# Only this file is at the root: GitHub Pages serves the whole branch, so the other
# settings live in .github/.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^CNAME$  # as GitHub writes it when the domain is set in its settings
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json  # the web app manifest is JSON under its own extension
        types: [text]
        files: '\.(json|webmanifest)$'
      - id: check-xml  # the sitemap and the SVGs
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # The pages' markup (html-validate's recommended rules): no inline styles or scripts,
  # which the pages' Content-Security-Policy would refuse anyway. With npx on the system's
  # Node, at an exact version (pre-commit's node hooks download a Node of their own on
  # Windows); its own dependencies float within npm's 7-day cooldown, without install
  # scripts (the user's .npmrc locally, the workflow's environment in CI).
  - repo: local
    hooks:
      - id: html-validate
        name: html-validate (the pages' markup)
        language: system
        entry: npx --yes html-validate@11.16.2 --config .github/htmlvalidate.json
        types: [html]

  - repo: https://github.com/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459  # frozen: v6.2.0
    hooks:
      - id: reuse-lint-file
        # multiprocessing workers intermittently crash on Windows
        entry: reuse --no-multiprocessing lint-file
        args: []

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list=shamin"]  # Martian Mono's designer

  # Secrets: the staged changes at commit, every commit before pushing. Not in CI, where
  # it would be compiled from Go source on each run: GitHub's secret scanning covers this
  # public repository there.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # frozen: v8.30.0
    hooks:
      - id: gitleaks
      - id: gitleaks
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --verbose --no-banner
        stages: [pre-push, manual]
        always_run: true

  # The workflows: zizmor their security, actionlint their correctness (and every `run:`
  # script through the shellcheck its image bundles). actionlint's release image by
  # digest, its tag the rev's version; a commit changing a workflow needs Docker running.
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint-docker
        entry: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
